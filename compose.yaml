# TLS is terminated outside this stack. The app and Authentik publish on loopback
# only so a host reverse proxy (normally nginx) can reach them.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cygnusloom
      POSTGRES_USER: cygnusloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - app-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cygnusloom -d cygnusloom"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CYGNUSLOOM_APP_PORT:-21872}:8000"
    env_file:
      - .env
    environment:
      CYGNUSLOOM_ENVIRONMENT: production
      CYGNUSLOOM_BASE_URL: https://${CYGNUSLOOM_DOMAIN}
      CYGNUSLOOM_DATABASE_URL: postgresql+psycopg://cygnusloom:${POSTGRES_PASSWORD}@db:5432/cygnusloom
      CYGNUSLOOM_AUTO_CREATE_SCHEMA: "0"
      CYGNUSLOOM_SECURE_COOKIES: "1"
      CYGNUSLOOM_OIDC_ISSUER: https://${AUTHENTIK_DOMAIN}/application/o/cygnusloom/
      CYGNUSLOOM_OIDC_CLIENT_ID: ${CYGNUSLOOM_OIDC_CLIENT_ID}
      CYGNUSLOOM_OIDC_CLIENT_SECRET: ${CYGNUSLOOM_OIDC_CLIENT_SECRET}
      CYGNUSLOOM_OIDC_SCOPES: openid email profile groups
      CYGNUSLOOM_OIDC_ADMIN_CLAIM: groups
      CYGNUSLOOM_OIDC_ADMIN_VALUES: ${CYGNUSLOOM_ADMIN_GROUP:-cygnusloom-admins}
      CYGNUSLOOM_OIDC_NAME: ${CYGNUSLOOM_OIDC_NAME:-Cygnus Loom SSO}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  authentik-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
    volumes:
      - authentik-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 20

  authentik-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - authentik-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  authentik-server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:2026.5.3}
    restart: unless-stopped
    command: server
    ports:
      - "127.0.0.1:${AUTHENTIK_PORT:-21873}:9000"
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      CYGNUSLOOM_ADMIN_GROUP: ${CYGNUSLOOM_ADMIN_GROUP:-cygnusloom-admins}
      CYGNUSLOOM_BASE_URL: https://${CYGNUSLOOM_DOMAIN}
      CYGNUSLOOM_OIDC_CLIENT_ID: ${CYGNUSLOOM_OIDC_CLIENT_ID}
      CYGNUSLOOM_OIDC_CLIENT_SECRET: ${CYGNUSLOOM_OIDC_CLIENT_SECRET}
      CYGNUSLOOM_OIDC_REDIRECT_URI: https://${CYGNUSLOOM_DOMAIN}/auth/callback
      CYGNUSLOOM_OIDC_POST_LOGOUT_URI: https://${CYGNUSLOOM_DOMAIN}/login
    volumes:
      - ./deploy/authentik/blueprints:/blueprints/custom:ro
      - authentik-media:/media
      - authentik-certs:/certs
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/-/health/live/', timeout=3)\"",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:2026.5.3}
    restart: unless-stopped
    command: worker
    environment:
      <<: *authentik-env
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:?set AUTHENTIK_BOOTSTRAP_EMAIL in .env}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?set AUTHENTIK_BOOTSTRAP_PASSWORD in .env}
    volumes:
      - ./deploy/authentik/blueprints:/blueprints/custom:ro
      - authentik-media:/media
      - authentik-certs:/certs
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

volumes:
  app-db:
  authentik-db:
  authentik-redis:
  authentik-media:
  authentik-certs:
