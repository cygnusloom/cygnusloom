services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cygnusforge
      POSTGRES_USER: cygnusforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - app-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cygnusforge -d cygnusforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CYGNUSFORGE_ENVIRONMENT: production
      CYGNUSFORGE_BASE_URL: https://${CYGNUSFORGE_DOMAIN}
      CYGNUSFORGE_DATABASE_URL: postgresql+psycopg://cygnusforge:${POSTGRES_PASSWORD}@db:5432/cygnusforge
      CYGNUSFORGE_AUTO_CREATE_SCHEMA: "0"
      CYGNUSFORGE_SECURE_COOKIES: "1"
      CYGNUSFORGE_OIDC_ISSUER: https://${AUTHENTIK_DOMAIN}/application/o/cygnusforge/
      CYGNUSFORGE_OIDC_CLIENT_ID: ${CYGNUSFORGE_OIDC_CLIENT_ID}
      CYGNUSFORGE_OIDC_CLIENT_SECRET: ${CYGNUSFORGE_OIDC_CLIENT_SECRET}
      CYGNUSFORGE_OIDC_SCOPES: openid email profile groups
      CYGNUSFORGE_OIDC_ADMIN_CLAIM: groups
      CYGNUSFORGE_OIDC_ADMIN_VALUES: ${CYGNUSFORGE_ADMIN_GROUP:-cygnusforge-admins}
      CYGNUSFORGE_OIDC_NAME: ${CYGNUSFORGE_OIDC_NAME:-Cygnus Forge SSO}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  authentik-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
    volumes:
      - authentik-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 20

  authentik-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - authentik-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  authentik-server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:2026.5.3}
    restart: unless-stopped
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      CYGNUSFORGE_ADMIN_GROUP: ${CYGNUSFORGE_ADMIN_GROUP:-cygnusforge-admins}
      CYGNUSFORGE_OIDC_CLIENT_ID: ${CYGNUSFORGE_OIDC_CLIENT_ID}
      CYGNUSFORGE_OIDC_CLIENT_SECRET: ${CYGNUSFORGE_OIDC_CLIENT_SECRET}
      CYGNUSFORGE_OIDC_REDIRECT_URI: https://${CYGNUSFORGE_DOMAIN}/auth/callback
      CYGNUSFORGE_OIDC_POST_LOGOUT_URI: https://${CYGNUSFORGE_DOMAIN}/login
    volumes:
      - ./deploy/authentik/blueprints:/blueprints/custom:ro
      - authentik-media:/media
      - authentik-certs:/certs
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/-/health/live/', timeout=3)\"",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:2026.5.3}
    restart: unless-stopped
    command: worker
    environment: *authentik-env
    volumes:
      - ./deploy/authentik/blueprints:/blueprints/custom:ro
      - authentik-media:/media
      - authentik-certs:/certs
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CYGNUSFORGE_DOMAIN: ${CYGNUSFORGE_DOMAIN}
      AUTHENTIK_DOMAIN: ${AUTHENTIK_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
      authentik-server:
        condition: service_started

volumes:
  app-db:
  authentik-db:
  authentik-redis:
  authentik-media:
  authentik-certs:
  caddy-data:
  caddy-config:
