# Local-only settings: plain HTTP, no DNS certificates.
#
#   python3 scripts/setup_env.py --domain localhost --idp-domain idp.localhost
#   docker compose -f compose.yaml -f compose.local.yaml up -d --build
#
# Browser URLs:
#   app:      http://localhost:21872
#   Authentik http://idp.localhost:21873
#
# The base compose file publishes both services on 127.0.0.1, so no extra
# ports are needed here. Modern browsers resolve *.localhost to the loopback
# address. If yours does not, add `127.0.0.1 idp.localhost` to your hosts file.
# The `ports: !override` tag below needs Docker Compose 2.24 or newer.
services:
  app:
    extra_hosts:
      - "idp.localhost:host-gateway"
    environment:
      CYGNUSLOOM_ENVIRONMENT: development
      CYGNUSLOOM_BASE_URL: http://localhost:${CYGNUSLOOM_APP_PORT:-21872}
      CYGNUSLOOM_SECURE_COOKIES: "0"
      CYGNUSLOOM_OIDC_ISSUER: http://idp.localhost:${AUTHENTIK_PORT:-21873}/application/o/cygnusloom/

  authentik-server:
    # The app container reaches the IdP through Docker's host gateway, so the
    # local IdP port must be reachable on the host's non-loopback address too.
    # Use this override only on a trusted machine or network.
    ports: !override
      - "0.0.0.0:${AUTHENTIK_PORT:-21873}:9000"
    environment:
      CYGNUSLOOM_BASE_URL: http://localhost:${CYGNUSLOOM_APP_PORT:-21872}
      CYGNUSLOOM_OIDC_REDIRECT_URI: http://localhost:${CYGNUSLOOM_APP_PORT:-21872}/auth/callback
      CYGNUSLOOM_OIDC_POST_LOGOUT_URI: http://localhost:${CYGNUSLOOM_APP_PORT:-21872}/login

  authentik-worker:
    environment:
      CYGNUSLOOM_BASE_URL: http://localhost:${CYGNUSLOOM_APP_PORT:-21872}
      CYGNUSLOOM_OIDC_REDIRECT_URI: http://localhost:${CYGNUSLOOM_APP_PORT:-21872}/auth/callback
      CYGNUSLOOM_OIDC_POST_LOGOUT_URI: http://localhost:${CYGNUSLOOM_APP_PORT:-21872}/login
