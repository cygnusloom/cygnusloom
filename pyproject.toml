[project]
name = "cygnusforge"
version = "0.1.0"
description = "Minimal web chat over an LLM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
    "httpx>=0.27",
    "markdown-it-py>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cygnusforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
