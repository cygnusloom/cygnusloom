[project]
name = "cygnusforge"
version = "2.0.0"
description = "Minimal web chat over an LLM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "httpx>=0.27",
    "markdown-it-py>=4.2.0",
    "shapely>=2.2.0",
    "authlib>=1.9.1",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cygnusforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
