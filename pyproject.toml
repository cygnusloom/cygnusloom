[project]
name = "cygnusloom"
version = "3.0.1"
description = "RPG with an AI game master"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "httpx>=0.27",
    "markdown-it-py>=4.2.0",
    "shapely>=2.2.0",
    "authlib>=1.9.1",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.6",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]

[project.scripts]
cygnusloom = "cygnusloom.cli:main"

[project.urls]
Homepage = "https://cygnusloom.com"
Source = "https://github.com/cygnusloom/cygnusloom"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-xdist>=3.8.0",
]
build = [
    "pyinstaller>=6",
    "pyinstaller-hooks-contrib>=2025",
    "PySide6>=6.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    ".env",
    ".env.*",
    "!.env.example",
    "*.env",
    "*.log",
    "*.db",
    "*.db-*",
    "*.sqlite",
    "*.sqlite-*",
    "*.sqlite3",
    "*.sqlite3-*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cygnusloom"]

[tool.hatch.build.targets.wheel.force-include]
"CREDITS.md" = "cygnusloom/CREDITS.md"
"LICENSE" = "cygnusloom/LICENSE"

[tool.hatch.build.targets.sdist]
only-include = [
    ".devcontainer",
    ".dockerignore",
    ".env.example",
    ".github",
    ".gitignore",
    ".vscode",
    "CREDITS.md",
    "Dockerfile",
    "ISSUE_TRACKER.md",
    "LICENSE",
    "README.md",
    "SPEC.md",
    "alembic.ini",
    "compose.local.yaml",
    "compose.yaml",
    "deploy",
    "packaging",
    "pyproject.toml",
    "scripts",
    "src",
    "tests",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
