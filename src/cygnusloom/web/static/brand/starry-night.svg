  <!-- a handful of warm stars -->
  <g fill="#ffe9a6">
    <circle cx="620" cy="120" r="1.3" opacity="0.9"/>
    <circle cx="1410" cy="960" r="1.2" opacity="0.8"/>
    <circle cx="1740" cy="940" r="1.2" opacity="0.8"/>
    <circle cx="80" cy="760" r="1" opacity="0.7"/>
    <circle cx="700" cy="840" r="0.9" opacity="0.6"/>
  </g>

  <!-- Cygnus, drawn faintly in gold: tail/body/neck/beak and wings -->
  <g fill="none" stroke="#f5c542" stroke-opacity="0.16" stroke-width="1.4" stroke-linecap="round">
    <path d="M1397.4 157.8 1321.8 237.6 1300.8 292.2 1275.6 351"/>
    <path d="M1237.8 258.6 1321.8 237.6 1372.2 254.4 1431 271.2"/>
  </g>
  <g>
    <circle cx="1397.4" cy="157.8" r="10" fill="url(#gold-glow)" opacity="0.45"/>
    <circle cx="1321.8" cy="237.6" r="9" fill="url(#gold-glow)" opacity="0.4"/>
    <circle cx="1300.8" cy="292.2" r="8" fill="url(#gold-glow)" opacity="0.35"/>
    <circle cx="1275.6" cy="351" r="8" fill="url(#gold-glow)" opacity="0.35"/>
    <circle cx="1237.8" cy="258.6" r="8" fill="url(#gold-glow)" opacity="0.35"/>
    <circle cx="1372.2" cy="254.4" r="7" fill="url(#gold-glow)" opacity="0.3"/>
    <circle cx="1431" cy="271.2" r="7" fill="url(#gold-glow)" opacity="0.3"/>
    <g fill="#fff4cf">
      <circle cx="1397.4" cy="157.8" r="2.2"/>
      <circle cx="1321.8" cy="237.6" r="1.8"/>
      <circle cx="1300.8" cy="292.2" r="1.4"/>
      <circle cx="1275.6" cy="351" r="1.4"/>
      <circle cx="1237.8" cy="258.6" r="1.4"/>
      <circle cx="1372.2" cy="254.4" r="1.2"/>
      <circle cx="1431" cy="271.2" r="1.2"/>
    </g>
  </g>

  <!-- bright foreground stars -->
  <g>
    <circle cx="240" cy="180" r="12" fill="url(#glow)" opacity="0.5"/>
    <circle cx="850" cy="880" r="10" fill="url(#glow)" opacity="0.45"/>
    <circle cx="1190" cy="300" r="10" fill="url(#glow)" opacity="0.4"/>
    <circle cx="1850" cy="1000" r="9" fill="url(#glow)" opacity="0.4"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
