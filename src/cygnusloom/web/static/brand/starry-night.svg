      <circle cx="1470" cy="620" r="1.1"/>
      <circle cx="1750" cy="400" r="1.1"/>
      <circle cx="1900" cy="680" r="1"/>
    </g>
    <g opacity="0.45">
      <circle cx="60" cy="90" r="0.7"/>
      <circle cx="190" cy="520" r="0.8"/>
      <circle cx="150" cy="980" r="0.7"/>
      <circle cx="300" cy="330" r="0.8"/>
      <circle cx="360" cy="60" r="0.7"/>
      <circle cx="450" cy="840" r="0.7"/>
      <circle cx="610" cy="720" r="0.8"/>
      <circle cx="660" cy="980" r="0.9"/>
      <circle cx="760" cy="300" r="0.7"/>
      <circle cx="800" cy="560" r="0.8"/>
      <circle cx="900" cy="80" r="0.7"/>
      <circle cx="930" cy="380" r="0.8"/>
      <circle cx="980" cy="660" r="0.7"/>
      <circle cx="1020" cy="940" r="0.8"/>
      <circle cx="1120" cy="500" r="0.7"/>
      <circle cx="1180" cy="60" r="0.7"/>
      <circle cx="1230" cy="940" r="0.8"/>
      <circle cx="1290" cy="120" r="0.8"/>
      <circle cx="1320" cy="520" r="0.9"/>
      <circle cx="1360" cy="760" r="0.7"/>
      <circle cx="1470" cy="80" r="0.8"/>
      <circle cx="1500" cy="340" r="0.7"/>
      <circle cx="1580" cy="820" r="0.7"/>
      <circle cx="1660" cy="460" r="0.7"/>
      <circle cx="1740" cy="940" r="0.8"/>
      <circle cx="1830" cy="560" r="0.7"/>
      <circle cx="1880" cy="840" r="0.7"/>
      <circle cx="40" cy="420" r="0.8"/>
      <circle cx="170" cy="840" r="0.8"/>
      <circle cx="280" cy="930" r="0.7"/>
      <circle cx="330" cy="160" r="0.7"/>
      <circle cx="470" cy="540" r="0.8"/>
      <circle cx="590" cy="860" r="0.8"/>
      <circle cx="640" cy="600" r="0.7"/>
      <circle cx="780" cy="60" r="0.7"/>
      <circle cx="880" cy="240" r="0.8"/>
      <circle cx="940" cy="520" r="0.8"/>
      <circle cx="990" cy="340" r="0.7"/>
      <circle cx="1090" cy="80" r="0.8"/>
      <circle cx="1130" cy="940" r="0.8"/>
      <circle cx="1240" cy="560" r="0.7"/>
      <circle cx="1330" cy="680" r="0.8"/>
      <circle cx="1380" cy="420" r="0.8"/>
      <circle cx="1430" cy="200" r="0.7"/>
      <circle cx="1520" cy="900" r="0.8"/>
      <circle cx="1570" cy="60" r="0.8"/>
      <circle cx="1610" cy="320" r="0.7"/>
      <circle cx="1690" cy="120" r="0.7"/>
