<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A starry night sky">
  <title>Starry night</title>
  <!-- Authentik sign-in background. Deep navy sky, a faint Milky Way, scattered stars, and the
       Cygnus constellation in the upper right. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#06080e"/>
      <stop offset="0.45" stop-color="#0b101b"/>
      <stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <radialGradient id="galaxy" cx="0.62" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#243252" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#141c30" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0b101b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="band" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a3a5c" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#1a2438" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0b101b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6efff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e6efff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#galaxy)"/>
  <rect x="-420" y="330" width="2760" height="340" fill="url(#band)" transform="rotate(-23 960 540)"/>

  <!-- scattered stars -->
  <g fill="#e8eaff">
    <g opacity="0.9">
      <circle cx="240" cy="180" r="2"/>
      <circle cx="560" cy="400" r="1.4"/>
      <circle cx="850" cy="880" r="1.6"/>
      <circle cx="1190" cy="300" r="1.5"/>
      <circle cx="1650" cy="660" r="1.4"/>
      <circle cx="1850" cy="1000" r="1.6"/>
    </g>
    <g opacity="0.7">
      <circle cx="120" cy="240" r="1"/>
      <circle cx="390" cy="620" r="1.1"/>
      <circle cx="520" cy="210" r="1"/>
      <circle cx="700" cy="140" r="1.2"/>
      <circle cx="850" cy="880" r="1"/>
      <circle cx="1080" cy="220" r="1.2"/>
      <circle cx="1160" cy="760" r="1.1"/>
      <circle cx="1530" cy="580" r="1.2"/>
      <circle cx="1620" cy="200" r="1.1"/>
      <circle cx="1700" cy="700" r="1.1"/>
      <circle cx="1790" cy="320" r="1"/>
      <circle cx="1870" cy="140" r="1.1"/>
      <circle cx="100" cy="640" r="1.2"/>
      <circle cx="420" cy="380" r="1.3"/>
      <circle cx="530" cy="80" r="1.1"/>
      <circle cx="690" cy="420" r="1.2"/>
      <circle cx="820" cy="760" r="1.1"/>
      <circle cx="1040" cy="760" r="1.1"/>
