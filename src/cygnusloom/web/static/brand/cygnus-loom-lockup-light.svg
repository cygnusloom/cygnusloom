<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 64" width="316" height="64" role="img" aria-label="Cygnus Loom">
  <title>Cygnus Loom</title>
  <!-- Light-theme lockup for Authentik: mark plus wordmark. Keep the mark in sync with
       cygnus-loom.svg; tests/test_branding.py checks the constellation paths. -->
  <g>
    <!-- tile -->
    <rect x="1" y="1" width="62" height="62" rx="13" fill="#15171c"/>
    <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="12.25" fill="none" stroke="#3b414c" stroke-width="1.5"/>

    <!-- cloth building up on the lower beam -->
    <g>
      <rect x="10" y="44" width="44" height="9" rx="1" fill="#282213"/>
      <g stroke="#8a7a45" stroke-width="1" opacity="0.38">
        <path d="M10 46.5h44"/>
        <path d="M10 49h44"/>
        <path d="M10 51.5h44"/>
      </g>
    </g>

    <!-- loom: warped between two beams -->
    <g stroke-linecap="round">
      <g stroke="#8a7a45" stroke-width="1.3" opacity="0.34">
        <path d="M12 12v40"/>
        <path d="M20 12v40"/>
        <path d="M28 12v40"/>
        <path d="M36 12v40"/>
        <path d="M44 12v40"/>
        <path d="M52 12v40"/>
      </g>
      <g stroke="#6b5a2e" stroke-width="3.5">
        <path d="M9 9.5h46"/>
        <path d="M9 54.5h46"/>
      </g>
    </g>

    <!-- the Cygnus constellation, laid over the warp -->
    <g fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <!-- tail, body, neck, beak -->
      <path d="M47 9 29 28 24 41 18 55"/>
      <!-- wings -->
      <path d="M9 33 29 28 41 32 55 36"/>
    </g>

    <!-- stars: glow, disc, and a sparkle for Deneb -->
    <g>
      <g fill="#f5c542" opacity="0.12">
        <circle cx="47" cy="9" r="4.5"/>
        <circle cx="29" cy="28" r="4"/>
        <circle cx="18" cy="55" r="3.5"/>
        <circle cx="9" cy="33" r="3.5"/>
        <circle cx="55" cy="36" r="3.5"/>
        <circle cx="41" cy="32" r="2.8"/>
        <circle cx="24" cy="41" r="2.8"/>
      </g>
      <path d="M47 3.9l1.05 4.05L52.1 9l-4.05 1.05L47 14.1l-1.05-4.05L41.9 9l4.05-1.05z" fill="#f5c542" opacity="0.5"/>
      <g fill="#fff4cf">
        <circle cx="47" cy="9" r="3.3"/>
        <circle cx="29" cy="28" r="2.9"/>
        <circle cx="18" cy="55" r="2.5"/>
        <circle cx="9" cy="33" r="2.5"/>
        <circle cx="55" cy="36" r="2.5"/>
        <circle cx="41" cy="32" r="1.8"/>
        <circle cx="24" cy="41" r="1.8"/>
      </g>
    </g>
  </g>

  <text
    x="80"
    y="43"
    fill="#15171c"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="33"
    font-weight="600"
    letter-spacing="-0.6"
  >Cygnus Loom</text>
</svg>
