{% extends "base.html" %}
{% block title %}New campaign{% endblock %}
{% block content %}
  <section class="card narrow">
    <h1>New campaign</h1>
    {% if error %}
      <p role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="/campaigns/new">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        Name
        <input type="text" name="name" value="{{ campaign_name }}" required maxlength="120">
      </label>
      <button type="submit">Create</button>
    </form>
  </section>
{% endblock %}
