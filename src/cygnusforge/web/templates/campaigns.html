{% extends "base.html" %}
{% block title %}Campaigns{% endblock %}
{% block content %}
  <section class="card wide">
    <div class="heading">
      <h1>Campaigns</h1>
      <a class="button" href="/campaigns/new">New campaign</a>
    </div>
    {% if campaigns %}
      <ul class="campaigns">
        {% for campaign in campaigns %}
          <li><a href="/campaigns/{{ campaign.id }}">{{ campaign.name }}</a></li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="muted">No campaigns yet.</p>
    {% endif %}
  </section>
{% endblock %}
