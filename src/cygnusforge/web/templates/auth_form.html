{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
  <section class="card narrow">
    <h1>{{ heading }}</h1>
    <form method="post" action="{{ action }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        Email
        <input type="email" name="email" value="{{ email }}" required autocomplete="email">
      </label>
      <label>
        Password
        <input type="password" name="password" required autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}">
      </label>
      <button type="submit">{{ heading }}</button>
    </form>
    {% if mode == "register" %}
      <p>Already registered? <a href="/login">Log in</a></p>
    {% else %}
      <p>No account? <a href="/register">Register</a></p>
      {% if test_login %}
        <form method="post" action="/login/test-user">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit">Log in as test user</button>
        </form>
      {% endif %}
    {% endif %}
  </section>
{% endblock %}
