# Cygnus Loom behind an existing nginx.
#
# Copy this file to /etc/nginx/conf.d/cygnusloom.conf and replace:
#   - cygnusloom.example.com with the public app hostname
#   - idp.cygnusloom.example.com with the public Authentik hostname
#   - the certificate paths if they differ on your host
#
# Then run:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The compose stack publishes the app on 127.0.0.1:21872 and Authentik on
# 127.0.0.1:21873. It does not publish ports 80 or 443.

map $http_upgrade $cygnusloom_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name cygnusloom.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cygnusloom.example.com;

    ssl_certificate     /etc/letsencrypt/live/cygnusloom.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cygnusloom.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cygnusloom_app:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:21872;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # The GM streams a turn as Server-Sent Events. Do not buffer it.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name idp.cygnusloom.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name idp.cygnusloom.example.com;

    ssl_certificate     /etc/letsencrypt/live/cygnusloom.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cygnusloom.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cygnusloom_idp:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:21873;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cygnusloom_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 3600s;
    }
}
