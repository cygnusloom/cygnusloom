version: 1
metadata:
  name: Cygnus Loom
entries:
  - model: authentik_core.group
    id: cygnusloom-admins
    identifiers:
      name: !Env CYGNUSLOOM_ADMIN_GROUP
    attrs:
      name: !Env CYGNUSLOOM_ADMIN_GROUP

  - model: authentik_core.group
    id: cygnusloom-credit-exempt
    identifiers:
      name: cygnusloom-credit-exempt
    attrs:
      name: cygnusloom-credit-exempt

  - model: authentik_core.group
    id: cygnusloom-players
    identifiers:
      name: cygnusloom-players
    attrs:
      name: cygnusloom-players

  - model: authentik_providers_oauth2.scopemapping
    id: cygnusloom-groups
    identifiers:
      name: Cygnus Loom groups
    attrs:
      name: Cygnus Loom groups
      scope_name: groups
      expression: |
        return {"groups": [group.name for group in request.user.groups.all()]}

  - model: authentik_providers_oauth2.oauth2provider
    id: cygnusloom-provider
    identifiers:
      name: Cygnus Loom
    attrs:
      name: Cygnus Loom
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env CYGNUSLOOM_OIDC_CLIENT_ID
      client_secret: !Env CYGNUSLOOM_OIDC_CLIENT_SECRET
      include_claims_in_id_token: true
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: !Env CYGNUSLOOM_OIDC_REDIRECT_URI
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Env CYGNUSLOOM_OIDC_POST_LOGOUT_URI
          redirect_uri_type: logout
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf cygnusloom-groups

  - model: authentik_core.application
    id: cygnusloom-app
    identifiers:
      slug: cygnusloom
    attrs:
      name: Cygnus Loom
      slug: cygnusloom
      provider: !KeyOf cygnusloom-provider
      meta_launch_url: !Env CYGNUSLOOM_BASE_URL

  - model: authentik_stages_prompt.prompt
    id: cygnusloom-enrollment-field-username
    identifiers:
      name: cygnusloom-enrollment-field-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      placeholder_expression: false
      order: 0

  - model: authentik_stages_prompt.prompt
    id: cygnusloom-enrollment-field-password
    identifiers:
      name: cygnusloom-enrollment-field-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 1

  - model: authentik_stages_prompt.prompt
    id: cygnusloom-enrollment-field-password-repeat
    identifiers:
      name: cygnusloom-enrollment-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      placeholder_expression: false
      order: 2

  - model: authentik_stages_prompt.prompt
    id: cygnusloom-enrollment-field-name
    identifiers:
      name: cygnusloom-enrollment-field-name
    attrs:
      field_key: name
      label: Name
      type: text
      required: true
      placeholder: Name
      placeholder_expression: false
      order: 0

  - model: authentik_stages_prompt.prompt
    id: cygnusloom-enrollment-field-email
    identifiers:
      name: cygnusloom-enrollment-field-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      placeholder_expression: false
      order: 1

  - model: authentik_stages_prompt.promptstage
    id: cygnusloom-enrollment-prompt-account
    identifiers:
      name: cygnusloom-enrollment-prompt-account
    attrs:
      fields:
        - !KeyOf cygnusloom-enrollment-field-username
        - !KeyOf cygnusloom-enrollment-field-password
        - !KeyOf cygnusloom-enrollment-field-password-repeat

  - model: authentik_stages_prompt.promptstage
    id: cygnusloom-enrollment-prompt-profile
    identifiers:
      name: cygnusloom-enrollment-prompt-profile
    attrs:
      fields:
        - !KeyOf cygnusloom-enrollment-field-name
        - !KeyOf cygnusloom-enrollment-field-email

  - model: authentik_stages_invitation.invitationstage
    id: cygnusloom-enrollment-invitation
    identifiers:
      name: cygnusloom-enrollment-invitation
    attrs:
      continue_flow_without_invitation: false

  - model: authentik_stages_user_write.userwritestage
    id: cygnusloom-enrollment-user-write
    identifiers:
      name: cygnusloom-enrollment-user-write
    attrs:
      user_creation_mode: always_create
      user_type: internal
      create_users_group: !KeyOf cygnusloom-players

  - model: authentik_stages_user_login.userloginstage
    id: cygnusloom-enrollment-user-login
    identifiers:
      name: cygnusloom-enrollment-user-login

  - model: authentik_flows.flow
    id: cygnusloom-enrollment-invite
    identifiers:
      slug: cygnusloom-enrollment-invite
    attrs:
      name: Cygnus Loom invitation enrollment
      title: Create your Cygnus Loom account
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_policies_expression.expressionpolicy
    id: cygnusloom-enrollment-redirect
    identifiers:
      name: cygnusloom-enrollment-redirect
    attrs:
      expression: !Format [
        "base_url = \"%s\"\nnext_url = None\nif request.http_request:\n    next_url = request.http_request.session.get(\"authentik/flows/get\", {}).get(\"next\")\nif not next_url or not next_url.startswith(base_url + \"/\"):\n    next_url = base_url + \"/auth/login\"\ncontext[\"flow_plan\"].context[\"redirect\"] = next_url\nreturn True",
        !Env CYGNUSLOOM_BASE_URL,
      ]

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf cygnusloom-enrollment-invite
      stage: !KeyOf cygnusloom-enrollment-invitation
      order: 5

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf cygnusloom-enrollment-invite
      stage: !KeyOf cygnusloom-enrollment-prompt-account
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf cygnusloom-enrollment-invite
      stage: !KeyOf cygnusloom-enrollment-prompt-profile
      order: 11

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf cygnusloom-enrollment-invite
      stage: !KeyOf cygnusloom-enrollment-user-write
      order: 20

  - model: authentik_flows.flowstagebinding
    id: cygnusloom-enrollment-user-login-binding
    identifiers:
      target: !KeyOf cygnusloom-enrollment-invite
      stage: !KeyOf cygnusloom-enrollment-user-login
      order: 100

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf cygnusloom-enrollment-redirect
      target: !KeyOf cygnusloom-enrollment-user-login-binding
      order: 0

  # Remove the earlier flow-level binding so upgrades do not keep a policy that runs before
  # the flow plan exists.
  - model: authentik_policies.policybinding
    state: absent
    identifiers:
      policy: !KeyOf cygnusloom-enrollment-redirect
      target: !KeyOf cygnusloom-enrollment-invite
      order: 0
